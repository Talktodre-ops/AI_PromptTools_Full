name: Keep Services Alive

on:
  schedule:
    # Run every 10 minutes to keep services active
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-render-alive:
    name: Keep Render Backend Alive
    runs-on: ubuntu-latest

    steps:
    - name: Ping Render Backend
      run: |
        echo "Pinging Render backend to keep it alive..."
        echo "Target URL: https://prompt-engineer-api.onrender.com"
        curl -f https://prompt-engineer-api.onrender.com/health || curl -f https://prompt-engineer-api.onrender.com/ || echo "Render backend ping failed"

    - name: Log Render Status
      run: |
        echo "Render keep-alive completed at $(date)"
        echo "Backend URL: https://prompt-engineer-api.onrender.com"

  keep-supabase-alive:
    name: Keep Supabase Alive
    runs-on: ubuntu-latest

    steps:
    - name: Ping Supabase
      run: |
        echo "Pinging Supabase to keep connection alive..."
        echo "Target URL: ${{ secrets.SUPABASE_URL }}"
        curl -f "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || echo "Supabase ping failed"

    - name: Log Supabase Status
      run: |
        echo "Supabase keep-alive completed at $(date)"
        echo "Supabase URL: ${{ secrets.SUPABASE_URL }}"